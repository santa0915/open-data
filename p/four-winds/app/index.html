<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>フォーウィンズ — Four Winds</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1 L10 8 L8 15 L6 8 Z' fill='%236ee7ff'/%3E%3Cpath d='M1 8 L8 6 L15 8 L8 10 Z' fill='%23ff8dc7'/%3E%3C/svg%3E">
  <style>
    /* 依存ゼロ方針のため CSS もこのファイルに内包する(外部CDN禁止)。
       配色は cosmo-merge の暗色宇宙テーマ系統を踏襲 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: radial-gradient(ellipse at 50% 20%, #1a2340 0%, #0a0e1e 70%);
      color: #dde4f2;
      font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
      touch-action: manipulation;
    }

    .wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 { font-size: 18px; letter-spacing: 2px; }

    .hud {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
    }
    .hud .label { opacity: 0.6; font-size: 11px; display: block; }
    .hud .value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

    #mute {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      font-size: 16px;
      padding: 4px 8px;
      cursor: pointer;
      color: inherit;
    }

    .stage { position: relative; width: 100%; max-width: 720px; }

    canvas#game {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      -webkit-user-select: none;
      user-select: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(5, 8, 18, 0.82);
      border-radius: 6px;
    }
    #overlay[hidden] { display: none; }
    #overlay h2 { font-size: 26px; letter-spacing: 4px; }
    #overlay p { font-size: 15px; opacity: 0.85; }
    #final-score { font-size: 34px; font-weight: 800; color: #6ee7ff; }

    #restart {
      background: #6ee7ff;
      color: #0a0e1e;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      padding: 10px 32px;
      cursor: pointer;
    }
    #restart:hover { background: #9ef0ff; }

    .help { font-size: 11px; opacity: 0.5; text-align: center; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>フォーウィンズ</h1>
      <div class="hud">
        <div>
          <span class="label">スコア</span>
          <span class="value" id="score">0</span>
        </div>
        <div>
          <span class="label">ベスト</span>
          <span class="value" id="best">0</span>
        </div>
        <div>
          <span class="label">残機</span>
          <span class="value" id="lives">3</span>
        </div>
        <div>
          <span class="label">武器</span>
          <span class="value" id="weapon">Lv1</span>
        </div>
        <button id="mute" aria-label="サウンド切り替え">🔊</button>
      </div>
    </header>

    <div class="stage">
      <canvas id="game"></canvas>
      <div id="overlay" hidden>
        <h2 id="overlay-title">ゲームオーバー</h2>
        <p>スコア</p>
        <div id="final-score">0</div>
        <button id="restart">もういちど</button>
      </div>
    </div>

    <p class="help">
      WASD / 矢印キーで移動 ・ Z / スペースでショット(押しっぱなし連射)<br>
      15秒ごとにスクロール方向が 右→上→左→下 と回る。右上のコンパスが次の切替を教えてくれる。<br>
      オレンジの敵を撃つとカプセルが出る。拾うと武器が育つ(Lv3まで)。ボスを倒せばクリア。
    </p>
  </div>

  <!-- ES Modules を使うため file:// では動かない。ローカルでは
       `python3 -m http.server` 等で配信すること(README 参照) -->
  <script type="module" src="./src/main.js"></script>
<footer class="sm-provenance" style="font:12px/1.6 system-ui,sans-serif;color:#6b6b6b;padding:1rem;margin-top:2rem;border-top:1px solid #e2e2de;"><span>生成: 2026-09-13T04:11:54Z</span></footer></body>
</html>
