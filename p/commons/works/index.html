const state = {
  data: CATALOG,
  q: "",
  areas: new Set(),
  section: null,
  kind: "",
  sort: "updated",
  table: false,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const seriesVar = (slot) => `var(--series-${((slot - 1) % 5) + 1})`;

// 末尾セグメントだけでは意味が立たない一般名は親を1つ足して表示する
const GENERIC_SEGMENTS = new Set(["raw", "projects", "docs", "design", "evaluations", "personas", "templates", "skills", "examples", "src"]);
function shortSection(path) {
  const parts = path.split("/");
  const last = parts[parts.length - 1];
  return GENERIC_SEGMENTS.has(last) && parts.length > 1 ? parts.slice(-2).join("/") : last;
}

function areaSlot(areaId) {
  const found = (state.data.areas || []).find((a) => a.id === areaId);
  return found ? found.slot : 1;
}
function fmtBytes(n) {
  if (!n) return "0 B";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0, v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (v >= 10 || i === 0 ? Math.round(v) : v.toFixed(1)) + " " + units[i];
}

/* ---- ツールチップ(チャートのホバー層) ---- */
const tip = $("tip");
function showTip(evt, html) {
  tip.innerHTML = html;
  tip.style.opacity = "1";
  const pad = 12;
  const rect = tip.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + rect.width > window.innerWidth - 8) x = evt.clientX - rect.width - pad;
  if (y + rect.height > window.innerHeight - 8) y = evt.clientY - rect.height - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function hideTip() { tip.style.opacity = "0"; }
function bindTip(el, html) {
  el.addEventListener("mouseenter", (e) => showTip(e, html));
  el.addEventListener("mousemove", (e) => showTip(e, html));
  el.addEventListener("mouseleave", hideTip);
}

/* ---- 統計タイル ---- */
function renderTiles() {
  const t = state.data.totals;
  const tiles = [
    { label: "成果物", value: t.deliverables, note: `${state.data.sections.length} セクション`, hero: true },
    { label: "ファイル総数", value: t.files.toLocaleString(), note: fmtBytes(t.bytes) },
    { label: "直近30日に更新", value: t.recent, note: t.latest_update ? `最終更新 ${t.latest_update}` : "" },
    { label: "ブラウザで動く", value: t.playable, note: "index.html を持つ成果物" },
    { label: "テストあり", value: t.tested, note: "tests/ を持つ成果物" },
  ];
  $("tiles").innerHTML = tiles.map((tile) => `
    <div class="tile${tile.hero ? " hero" : ""}">
      <div class="label">${esc(tile.label)}</div>
      <div class="value">${esc(tile.value)}</div>
      <div class="note">${esc(tile.note)}</div>
    </div>`).join("");
}

/* ---- セクション別 横棒(エリアで色分け・直接ラベルつき) ---- */
function renderSections() {
  const rows = state.data.sections.filter((s) => s.count > 0).slice(0, 14);
  const max = Math.max(1, ...rows.map((s) => s.count));
  const host = $("chart-sections");
  host.innerHTML = "";
  rows.forEach((s) => {
    const btn = document.createElement("button");
    btn.className = "barrow";
    btn.type = "button";
    btn.setAttribute("aria-pressed", String(state.section === s.path));
    const color = seriesVar(areaSlot(s.area));
    const label = shortSection(s.path);
    btn.innerHTML = `
      <span class="barlabel" title="${esc(s.path)}"><span class="swatch" style="background:${color}"></span>${esc(label)}</span>
      <span class="bartrack"><span class="bar" style="width:${(s.count / max) * 100}%;background:${color}"></span></span>
      <span class="barvalue">${s.count}</span>`;
    bindTip(btn, `<strong>${esc(s.title || s.path)}</strong><br>${esc(s.path)}<br>成果物 ${s.count} 件`);
    btn.addEventListener("click", () => {
      state.section = state.section === s.path ? null : s.path;
      render();
    });
    host.appendChild(btn);
  });

  const hidden = state.data.sections.filter((s) => s.count > 0).length - rows.length;
  $("legend-areas").innerHTML = state.data.areas.map((a) =>
    `<span><span class="swatch" style="background:${seriesVar(a.slot)}"></span>${esc(a.label)}</span>`).join("") +
    (hidden > 0 ? `<span style="color:var(--text-muted)">ほか ${hidden} セクション</span>` : "");
}

/* ---- 最近の更新(時間軸は棒グラフより一覧のほうが読める) ---- */
function renderRecent() {
  const rows = state.data.deliverables
    .slice()
    .sort((a, b) => (b.updated || "").localeCompare(a.updated || ""))
    .slice(0, 9);
  $("recent").innerHTML = rows.map((d) => {
    const href = (d.links || [])[0]?.href || d.playable || d.entry || d.path;
    return `<li>
      <span class="when">${esc((d.updated || "—").slice(5))}</span>
      <span class="what" title="${esc(d.path)}"><a href="${esc(href)}" target="_blank" rel="noopener">${esc(d.title)}</a></span>
      <span class="where"><span class="swatch" style="background:${seriesVar(areaSlot(d.area))}"></span> ${esc(kindLabel(d.kind))}</span>
    </li>`;
  }).join("");
}

/* ---- 絞り込みUI ---- */
function renderChips() {
  $("chips").innerHTML = state.data.areas.map((a) => `
    <button class="chip" type="button" data-area="${esc(a.id)}" aria-pressed="${state.areas.has(a.id)}">
      <span class="swatch" style="background:${seriesVar(a.slot)}"></span>${esc(a.label)}
      <span class="count">${a.count}</span>
    </button>`).join("") +
    (state.section ? `<button class="chip" type="button" data-clear-section="1" aria-pressed="true">セクション: ${esc(state.section)} ✕</button>` : "");

  $("chips").querySelectorAll("[data-area]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.area;
      state.areas.has(id) ? state.areas.delete(id) : state.areas.add(id);
      render();
    });
  });
  const clear = $("chips").querySelector("[data-clear-section]");
  if (clear) clear.addEventListener("click", () => { state.section = null; render(); });

  const kindSelect = $("kind");
  if (kindSelect.options.length !== state.data.kinds.length + 1) {
    kindSelect.innerHTML = `<option value="">すべての種別</option>` +
      state.data.kinds.map((k) => `<option value="${esc(k.id)}">${esc(k.label)}（${k.count}）</option>`).join("");
    kindSelect.value = state.kind;
  }
}

/* ---- 一覧 ---- */
function filtered() {
  const q = state.q.trim().toLowerCase();
  let items = state.data.deliverables.filter((d) => {
    if (state.areas.size && !state.areas.has(d.area)) return false;
    if (state.section && d.section !== state.section) return false;
    if (state.kind && d.kind !== state.kind) return false;
    if (!q) return true;
    return [d.title, d.name, d.path, d.summary, d.section_title, (d.tags || []).join(" ")]
      .join(" ").toLowerCase().includes(q);
  });
  const by = {
    updated: (a, b) => (b.updated || "").localeCompare(a.updated || ""),
    files: (a, b) => b.files - a.files,
    name: (a, b) => a.title.localeCompare(b.title, "ja"),
    section: (a, b) => a.section.localeCompare(b.section) || a.name.localeCompare(b.name, "ja"),
  }[state.sort];
  return items.slice().sort(by);
}

function kindLabel(id) {
  const k = state.data.kinds.find((x) => x.id === id);
  return k ? k.label : id;
}

function links(d) {
  const out = [];
  const remote = (state.data.repo || {}).remote;
  // 公開版: 公開先だけを出す(ローカルの入口・リポジトリへのリンクは持たない)
  if ((d.links || []).length) {
    return d.links.map((l) => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
  }
  if (d.playable) out.push(`<a href="${esc(d.playable)}" target="_blank" rel="noopener">▶ 開く</a>`);
  if (d.entry) out.push(`<a href="${esc(d.entry)}" target="_blank" rel="noopener">説明</a>`);
  if (remote) out.push(`<a href="${esc(remote)}/tree/main/${esc(d.path)}" target="_blank" rel="noopener">GitHub</a>`);
  return out.join("");
}

function renderList() {
  const items = filtered();
  const total = state.data.deliverables.length;
  $("result-meta").textContent = items.length === total
    ? `${total} 件すべてを表示中`
    : `${items.length} / ${total} 件を表示中`;

  if (!items.length) {
    $("cards").innerHTML = `<p class="empty">該当する成果物がありません。</p>`;
    $("tbody").innerHTML = "";
    return;
  }

  $("cards").innerHTML = items.map((d) => `
    <article class="card">
      <div class="card-top">
        <span class="swatch" style="background:${seriesVar(areaSlot(d.area))}"></span>
        <span class="path" title="${esc(d.path)}">${esc(d.section)}</span>
        <span class="kind">${esc(kindLabel(d.kind))}</span>
      </div>
      <h3>${esc(d.title)}</h3>
      ${d.summary ? `<p>${esc(d.summary)}</p>` : ""}
      ${(d.tags || []).length ? `<div class="tags">${d.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      <div class="card-foot">
        <span>${esc(d.updated || "—")}</span>
        <span>${d.files} ファイル</span>
        ${d.status ? `<span>${esc(d.status)}</span>` : ""}
        <span class="links">${links(d)}</span>
      </div>
    </article>`).join("");

  $("tbody").innerHTML = items.map((d) => `
    <tr>
      <td>${esc(d.title)}</td>
      <td>${esc(d.section)}</td>
      <td>${esc(kindLabel(d.kind))}</td>
      <td>${esc(d.updated || "—")}</td>
      <td class="num">${d.files}</td>
      <td><code>${esc(d.path)}</code></td>
    </tr>`).join("");
}

function render() {
  renderTiles();
  renderSections();
  renderRecent();
  renderChips();
  renderList();
  $("digest").textContent = `カタログ digest: ${state.data.digest}`;
  $("cards").classList.toggle("hidden", state.table);
  $("tablewrap").classList.toggle("hidden", !state.table);
}

/* ---- 入力 ---- */
$("q").addEventListener("input", (e) => { state.q = e.target.value; renderList(); });
$("kind").addEventListener("change", (e) => { state.kind = e.target.value; renderList(); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; renderList(); });
$("view").addEventListener("click", (e) => {
  state.table = !state.table;
  e.target.setAttribute("aria-pressed", String(state.table));
  e.target.textContent = state.table ? "カードで見る" : "表で見る";
  render();
});
$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme
    ? root.dataset.theme === "dark"
    : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape") { $("q").value = ""; state.q = ""; renderList(); }
});

/* ---- リアルタイム追従: catalog.json が取れる環境(--serve)では自動更新 ---- */
function setLive(on, at) {
  $("live").dataset.live = String(on);
  $("live-text").textContent = on ? "ライブ(自動更新)" : "スナップショット";
  if (at) $("subtitle").textContent = `スキャン: ${at}`;
}
async function poll() {
  if (!location.protocol.startsWith("http")) { setLive(false); return; }  // file:// では取りにいかない
  try {
    const res = await fetch("catalog.json", { cache: "no-store" });
    if (!res.ok) throw new Error("no live catalog");
    const next = await res.json();
    const changed = next.digest !== state.data.digest;
    state.data = next;
    setLive(true, next.generated_at);
    if (changed) render();
  } catch {
    setLive(false);
  }
}
render();
poll();
setInterval(() => { if (document.visibilityState === "visible") poll(); }, 8000);
</script>
