<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ヨモジ — Yomoji</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='2' fill='%236aaa64'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='bold'%3Eよ%3C/text%3E%3C/svg%3E">
  <style>
    /* 依存ゼロ方針のため CSS もこのファイルに内包する(外部CDN禁止)。
       配色は姉妹作(nine-grid/twin-leap)の紙風ライトテーマ系統。 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #e7e3d6;
      color: #3d4354;
      font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    h1 { font-size: 20px; letter-spacing: 4px; }
    #mode-label { font-size: 12px; opacity: 0.65; }
    .header-btns { display: flex; gap: 6px; }
    .header-btns button {
      background: #fff; color: #3d4354;
      border: 1px solid #c9c3b4; border-bottom-width: 2px;
      border-radius: 8px; font-size: 12px; padding: 5px 9px; cursor: pointer;
    }
    .header-btns button:hover { background: #faf8f2; }

    .stage { position: relative; width: 100%; display: flex; justify-content: center; }

    /* --- 盤面(tries行 × 4マス) --- */
    #board {
      display: grid;
      grid-template-columns: repeat(var(--cols, 4), 52px);
      gap: 6px;
      padding: 8px;
    }
    .tile {
      width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      background: #fff;
      border: 2px solid #d8d2c2;
      border-radius: 6px;
      font: 700 24px system-ui, "Hiragino Sans", sans-serif;
      transition: transform 0.12s;
    }
    .tile.filled { border-color: #a9a394; }
    .tile.hit  { background: #6aaa64; border-color: #6aaa64; color: #fff; }
    .tile.blow { background: #cdb44f; border-color: #cdb44f; color: #fff; }
    .tile.miss { background: #9ba0ab; border-color: #9ba0ab; color: #fff; }
    /* 「おしい」: 太枠+右上バッジ(キーボードの色には影響させない) */
    .tile.close { box-shadow: inset 0 0 0 3px #3d4354; }
    .tile .badge {
      position: absolute; top: -7px; right: -7px;
      background: #3d4354; color: #ffd76a;
      font: 700 10px system-ui, sans-serif;
      border-radius: 8px; padding: 1px 4px;
      letter-spacing: 0;
    }
    .tile.flip { animation: flip 0.24s ease; }
    @keyframes flip {
      0% { transform: rotateX(90deg); }
      100% { transform: rotateX(0); }
    }
    #board.shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* --- 50音キーボード(右から あ行→わ行) --- */
    #keyboard {
      display: flex;
      gap: 4px;
      justify-content: center;
    }
    .kb-col { display: flex; flex-direction: column; gap: 4px; }
    .key, .kb-gap {
      width: clamp(28px, 8.6vw, 44px);
      height: clamp(30px, 8.6vw, 42px);
    }
    .key {
      background: #fff; color: #3d4354;
      border: 1px solid #c9c3b4; border-bottom-width: 2px;
      border-radius: 6px;
      font: 600 clamp(13px, 3.6vw, 17px) system-ui, "Hiragino Sans", sans-serif;
      cursor: pointer;
      padding: 0;
    }
    .key:hover { background: #faf8f2; }
    .key.hit  { background: #6aaa64; border-color: #6aaa64; color: #fff; }
    .key.blow { background: #cdb44f; border-color: #cdb44f; color: #fff; }
    .key.miss { background: #9ba0ab; border-color: #9ba0ab; color: #fff; }

    .kb-actions { display: flex; gap: 6px; width: 100%; max-width: 480px; }
    .kb-actions button {
      flex: 1; padding: 10px 0;
      background: #fff; border: 1px solid #c9c3b4; border-bottom-width: 2px;
      border-radius: 8px; font-size: 14px; font-weight: 700;
      cursor: pointer; color: #3d4354;
    }
    .kb-actions button:hover { background: #faf8f2; }
    #enter { background: #3d4354; color: #f4f1e8; border-color: #3d4354; }

    /* --- トースト --- */
    #toast {
      position: fixed; top: 14px; left: 50%;
      transform: translateX(-50%);
      background: #3d4354; color: #f4f1e8;
      padding: 8px 16px; border-radius: 8px; font-size: 14px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
      z-index: 30;
    }
    #toast.show { opacity: 1; }

    /* --- オーバーレイ(結果・あそびかた) --- */
    .overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(38, 42, 54, 0.55);
      padding: 16px; z-index: 20;
    }
    .overlay[hidden] { display: none; }
    .panel {
      background: #f4f1e8; color: #3d4354;
      border-radius: 12px; padding: 22px;
      max-width: 380px; width: 100%;
      display: flex; flex-direction: column; gap: 12px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(38, 42, 54, 0.35);
    }
    .panel h2 { font-size: 24px; letter-spacing: 4px; }
    #result-answer { font-size: 18px; font-weight: 700; color: #6aaa64; }
    #result-stats { font-size: 12px; white-space: pre-line; line-height: 1.8; opacity: 0.8; }
    #share-text {
      font-size: 12px; white-space: pre-line; text-align: left;
      background: #fff; border: 1px solid #c9c3b4; border-radius: 6px;
      padding: 8px; user-select: all;
    }
    .panel button {
      padding: 9px 0;
      background: #fff; border: 1px solid #c9c3b4; border-bottom-width: 2px;
      border-radius: 8px; font-size: 14px; cursor: pointer; color: #3d4354;
    }
    .panel button:hover { background: #faf8f2; }
    .panel .primary { background: #3d4354; color: #f4f1e8; border-color: #3d4354; }
    /* 汎用の :hover(明色)が .primary の暗色背景に勝たないようにする */
    .panel .primary:hover { background: #4a5166; }

    .rules { font-size: 13px; text-align: left; line-height: 1.9; }
    .rules .chip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 4px;
      font-size: 12px; font-weight: 700; color: #fff; vertical-align: -4px;
    }
    .chip.c-hit { background: #6aaa64; }
    .chip.c-blow { background: #cdb44f; }
    .chip.c-miss { background: #9ba0ab; }
    .chip.c-close { background: #fff; color: #3d4354; box-shadow: inset 0 0 0 2px #3d4354; }

    .help-note { font-size: 11px; opacity: 0.6; text-align: center; line-height: 1.7; }
    kbd {
      background: #fff; border: 1px solid #c9c3b4; border-bottom-width: 2px;
      border-radius: 4px; padding: 0 4px; font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>ヨモジ</h1>
        <span id="mode-label">きょうのもんだい</span>
      </div>
      <div class="header-btns">
        <button id="mode-daily">きょう</button>
        <button id="mode-free">れんしゅう</button>
        <button id="help-btn">あそびかた</button>
        <button id="mute" aria-label="サウンド切り替え">🔊</button>
      </div>
    </header>

    <div class="stage">
      <div id="board" aria-label="ヨモジの盤面"></div>
    </div>

    <div id="keyboard" aria-label="50音キーボード"></div>

    <div class="kb-actions">
      <button id="cycle">゛゜小</button>
      <button id="delete">けす</button>
      <button id="enter">きめる</button>
    </div>

    <p class="help-note">
      PCはローマ字入力もできます(<kbd>Enter</kbd>=きめる / <kbd>Backspace</kbd>=けす)。<br>
      ひらがな4文字のことばを8回いないに当てよう。
    </p>
  </div>

  <div id="toast" role="status"></div>

  <!-- 結果オーバーレイ -->
  <div id="overlay" class="overlay" hidden>
    <div class="panel">
      <h2 id="result-title"></h2>
      <div id="result-answer"></div>
      <div id="result-stats"></div>
      <button id="share" class="primary">けっかをコピー</button>
      <div id="share-text" hidden></div>
      <button id="to-free">れんしゅうへ</button>
      <button id="close-overlay">とじる</button>
    </div>
  </div>

  <!-- あそびかたパネル(初回は自動表示) -->
  <div id="help" class="overlay" hidden>
    <div class="panel">
      <h2>あそびかた</h2>
      <div class="rules">
        ひらがな<b>4文字</b>のことばを<b>8回</b>いないに当てるゲームです。<br>
        <span class="chip c-hit">あ</span> みどり: 文字も場所もあっている<br>
        <span class="chip c-blow">あ</span> きいろ: 文字はあるけど場所がちがう<br>
        <span class="chip c-miss">あ</span> はいいろ: その文字は入っていない<br>
        <span class="chip c-close">あ</span> ふとわく「゛?」: <b>おしい!</b>
        濁点・半濁点・小さい字だけがちがう(例:「は」→ほんとうは「ば」)<br>
        「゛゜小」キーで直前の文字を変換できます(か→が、は→ば→ぱ、つ→っ→づ)。
      </div>
      <button id="help-close" class="primary">はじめる</button>
    </div>
  </div>

  <!-- ES Modules を使うため file:// では動かない。ローカルでは
       `python3 -m http.server` 等で配信すること(README 参照) -->
  <script type="module" src="./src/main.js"></script>
<footer class="sm-provenance" style="font:12px/1.6 system-ui,sans-serif;color:#6b6b6b;padding:1rem;margin-top:2rem;border-top:1px solid #e2e2de;"><span>生成: 2026-09-13T04:11:54Z</span></footer></body>
</html>
