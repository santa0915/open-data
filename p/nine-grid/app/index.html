<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ナイングリッド — Nine Grid</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='2' fill='%233d4354'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='%23ffd76a' font-family='sans-serif' font-weight='bold'%3E9%3C/text%3E%3C/svg%3E">
  <style>
    /* 依存ゼロ方針のため CSS もこのファイルに内包する(外部CDN禁止) */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #e7e3d6;
      color: #3d4354;
      font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    h1 { font-size: 18px; letter-spacing: 2px; }
    .hud { display: flex; align-items: center; gap: 14px; font-size: 13px; }
    .hud .label { opacity: 0.55; font-size: 11px; display: block; }
    .hud .value { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    #mute {
      background: none; border: 1px solid rgba(61,67,84,0.3);
      border-radius: 8px; font-size: 15px; padding: 3px 7px; cursor: pointer;
    }

    .newgame { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .newgame button {
      background: #fff; color: #3d4354;
      border: 1px solid #c9c3b4; border-bottom-width: 2px;
      border-radius: 8px; font-size: 13px; padding: 6px 12px; cursor: pointer;
    }
    .newgame button:hover { background: #faf8f2; }

    .stage { position: relative; width: 100%; }

    /* --- 盤面 --- */
    #board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      width: 100%;
      aspect-ratio: 1;
      background: #fff;
      border: 3px solid #3d4354;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(61, 67, 84, 0.2);
    }
    .cell {
      position: relative;
      border: none;
      border-right: 1px solid #d8d2c2;
      border-bottom: 1px solid #d8d2c2;
      background: #fff;
      font: 700 clamp(16px, 4.5vmin, 26px) system-ui, sans-serif;
      color: #3a78c9;           /* 自分で置いた数字 */
      cursor: pointer;
      padding: 0;
    }
    .cell.block-left { border-left: 2px solid #3d4354; }
    .cell.block-top { border-top: 2px solid #3d4354; }
    .cell.given { color: #3d4354; }            /* 出題マス */
    .cell.peer { background: #f2efe6; }        /* 同じ行・列・ブロック */
    .cell.same { background: #e3ecf8; }        /* 選択中と同じ数字 */
    .cell.selected { background: #cfe0f7; }
    .cell.conflict { color: #cc3b2e; background: #fbe7e4; }
    .cell:focus-visible { outline: 2px solid #3a78c9; outline-offset: -2px; }

    .notes {
      position: absolute; inset: 1px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      font: 400 clamp(7px, 1.7vmin, 10px) system-ui, sans-serif;
      color: #8a8f9c;
      pointer-events: none;
    }
    .notes span { display: flex; align-items: center; justify-content: center; }

    /* --- 数字パッドとツール --- */
    #pad {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 5px;
      width: 100%;
    }
    .pad {
      display: flex; flex-direction: column; align-items: center;
      gap: 1px; padding: 6px 0 4px;
      background: #fff; border: 1px solid #c9c3b4; border-bottom-width: 2px;
      border-radius: 8px; cursor: pointer;
    }
    .pad:hover { background: #faf8f2; }
    .pad-digit { font: 700 20px system-ui, sans-serif; color: #3d4354; }
    .pad-count { font-size: 10px; color: #8a8f9c; }
    .pad.exhausted { opacity: 0.35; }

    .tools { display: flex; gap: 6px; width: 100%; }
    .tools button {
      flex: 1; padding: 8px 0;
      background: #fff; border: 1px solid #c9c3b4; border-bottom-width: 2px;
      border-radius: 8px; font-size: 13px; cursor: pointer; color: #3d4354;
    }
    .tools button:hover { background: #faf8f2; }
    .tools button.active { background: #3d4354; color: #f4f1e8; }

    /* --- 完成オーバーレイ --- */
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: rgba(38, 42, 54, 0.88);
      border-radius: 6px; color: #f4f1e8; text-align: center; padding: 16px;
    }
    #overlay[hidden] { display: none; }
    #overlay h2 { font-size: 28px; letter-spacing: 5px; }
    #result { font-size: 15px; color: #ffd76a; font-weight: 700; }
    #overlay .newgame button { border-color: transparent; }

    .help { font-size: 11px; opacity: 0.6; text-align: center; line-height: 1.7; }
    kbd {
      background: #fff; border: 1px solid #c9c3b4; border-bottom-width: 2px;
      border-radius: 4px; padding: 0 4px; font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ナイングリッド</h1>
      <div class="hud">
        <div>
          <span class="label">レベル</span>
          <span class="value" id="difficulty">ふつう</span>
        </div>
        <div>
          <span class="label">タイム</span>
          <span class="value" id="time">0:00</span>
        </div>
        <div>
          <span class="label">ヒント</span>
          <span class="value" id="hints">0</span>
        </div>
        <button id="mute" aria-label="サウンド切り替え">🔊</button>
      </div>
    </header>

    <div class="newgame">
      <button data-new="easy">かんたん</button>
      <button data-new="normal">ふつう</button>
      <button data-new="hard">むずかしい</button>
      <button data-new="daily">きょうの1問</button>
    </div>

    <div class="stage">
      <div id="board" aria-label="ナンバープレースの盤面"></div>
      <div id="overlay" hidden>
        <h2>かんせい!</h2>
        <div id="result"></div>
        <div class="newgame">
          <button data-new="easy">かんたん</button>
          <button data-new="normal">ふつう</button>
          <button data-new="hard">むずかしい</button>
        </div>
      </div>
    </div>

    <div id="pad"></div>

    <div class="tools">
      <button id="note">✏️ メモ <kbd>N</kbd></button>
      <button id="erase">けす <kbd>⌫</kbd></button>
      <button id="undo">もどす <kbd>Z</kbd></button>
      <button id="hint-btn">ヒント <kbd>H</kbd></button>
    </div>

    <p class="help">
      マス選択: クリック / <kbd>←↑↓→</kbd> ・ 入力: <kbd>1</kbd>〜<kbd>9</kbd>(同じ数字で消える)<br>
      たて・よこ・3×3ブロックに同じ数字が入らないように全マスを埋めよう。
      途中経過は自動保存されます。
    </p>
  </div>

  <!-- ES Modules を使うため file:// では動かない。ローカルでは
       `python3 -m http.server` 等で配信すること(README 参照) -->
  <script type="module" src="./src/main.js"></script>
<footer class="sm-provenance" style="font:12px/1.6 system-ui,sans-serif;color:#6b6b6b;padding:1rem;margin-top:2rem;border-top:1px solid #e2e2de;"><span>生成: 2026-09-13T04:11:54Z</span></footer></body>
</html>
