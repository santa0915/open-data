<script>
const views = window.__CATALOG__.views || [];
const list = document.getElementById('list');
const search = document.getElementById('q');
const chips = Array.from(document.querySelectorAll('.chip'));
let project = '';

function render() {
  const q = search.value.trim().toLowerCase();
  const shown = views.filter(v => {
    if (project && v.project !== project) return false;
    if (!q) return true;
    return [v.title, v.summary, v.project, v.view, (v.tags || []).join(' ')]
      .join(' ').toLowerCase().includes(q);
  });
  list.innerHTML = '';
  if (!shown.length) {
    list.innerHTML = '<li class="empty">該当するビューがありません</li>';
    return;
  }
  for (const v of shown) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'card';
    a.href = v.path;
    const tags = (v.tags || []).map(t =>
      `<span class="tag">${t}</span>`).join('');
    const kind = v.kind === 'dataset'
      ? '<span class="tag kind">データセット</span>' : '';
    a.innerHTML =
      `<div class="title"></div><div class="summary"></div>` +
      `<div class="tags">${kind}<span class="tag">${v.project}</span>` +
      `<span class="tag">${v.updated_at.slice(0, 10)}</span>${tags}</div>`;
    a.querySelector('.title').textContent = v.title;
    a.querySelector('.summary').textContent = v.summary || '';
    li.appendChild(a);
    list.appendChild(li);
  }
}

search.addEventListener('input', render);
for (const chip of chips) {
  chip.addEventListener('click', () => {
    const value = chip.dataset.project || '';
    project = (project === value) ? '' : value;
    for (const c of chips) {
      c.setAttribute('aria-pressed', String((c.dataset.project || '') === project));
    }
    render();
  });
}
render();
</script>
